version: 2

# =============================================================================
# FreshCart — Marts Layer: Column Tests & Documentation
# =============================================================================

models:

  # ---------------------------------------------------------------------------
  - name: fact_daily_revenue
    description: >
      Daily revenue fact table at the store / product_category / brand / day grain.
      Powers Finance team Power BI dashboards. Includes margin, payment split,
      loyalty split, and running YTD totals.
    columns:
      - name: revenue_key
        description: Surrogate key (MD5 hash of date + store + category + brand)
        tests: [not_null, unique]

      - name: sale_date
        tests: [not_null]

      - name: store_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_id

      - name: product_category
        tests: [not_null]

      - name: total_revenue
        description: Total gross revenue in EUR for this grain
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000

      - name: gross_margin
        description: total_revenue minus total_cost in EUR

      - name: gross_margin_pct
        description: Gross margin as a percentage of revenue
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -100
              max_value: 100

      - name: transaction_count
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000

  # ---------------------------------------------------------------------------
  - name: dim_product
    description: >
      Product dimension. One row per unique SKU. Includes pricing tier
      classification for reporting segmentation.
    columns:
      - name: product_key
        tests: [not_null, unique]

      - name: product_sku
        tests: [not_null, unique]

      - name: product_name
        tests: [not_null]

      - name: product_category
        tests: [not_null]

      - name: price_tier
        tests:
          - accepted_values:
              values: ['Budget', 'Standard', 'Premium', 'Luxury']

  # ---------------------------------------------------------------------------
  - name: dim_customer
    description: >
      Customer dimension. One row per loyalty card customer. Includes
      RFM-inspired segmentation (Champion, Loyal, At Risk, Lapsed).
    columns:
      - name: customer_key
        tests: [not_null, unique]

      - name: customer_id
        tests: [not_null, unique]

      - name: customer_segment
        tests:
          - accepted_values:
              values: ['Champion', 'Loyal', 'At Risk', 'Never Purchased', 'Lapsed']

      - name: lifetime_value_eur
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000

  # ---------------------------------------------------------------------------
  - name: dim_store
    description: >
      Store dimension. One row per FreshCart store location.
    columns:
      - name: store_key
        tests: [not_null, unique]

      - name: store_id
        tests: [not_null, unique]

      - name: region
        tests:
          - accepted_values:
              values: ['Flanders', 'Wallonia', 'Brussels']

      - name: store_type
        tests:
          - accepted_values:
              values: ['SUPERMARKET', 'EXPRESS', 'ONLINE']

  # ---------------------------------------------------------------------------
  - name: fact_inventory_snapshot
    description: >
      Daily inventory snapshot fact table. One row per store / product / day.
      Powers Operations team reorder alerts and stock dashboards.
    columns:
      - name: inventory_key
        tests: [not_null, unique]

      - name: snapshot_date
        tests: [not_null]

      - name: store_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_id

      - name: product_sku
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_sku

      - name: quantity_on_hand
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 99999

      - name: stock_status
        tests:
          - accepted_values:
              values: ['OUT_OF_STOCK', 'LOW_STOCK', 'ADEQUATE']

      - name: stock_value_eur
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 10000000
