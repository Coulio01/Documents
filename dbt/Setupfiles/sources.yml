version: 2

# =============================================================================
# FreshCart — Bronze Layer Source Declarations
# These point to raw tables loaded by Fabric Data Factory pipelines
# into the Lakehouse SQL Analytics Endpoint (bronze schema)
# =============================================================================

sources:
  - name: freshcart_raw
    description: >
      Raw operational data ingested from FreshCart's POS system, ERP (Navision),
      and e-commerce platform. Loaded nightly via Fabric Data Factory pipelines
      into the bronze zone of the OneLake Lakehouse.
    schema: bronze
    database: "{{ env_var('FABRIC_LAKEHOUSE_DATABASE') }}"

    # Source freshness thresholds — dbt will warn/error if data is stale
    freshness:
      warn_after:  {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: _ingested_at

    tables:

      - name: raw_sales_transactions
        description: >
          Point-of-sale transaction records from all 8 FreshCart stores.
          One row per line item (product) per transaction.
        columns:
          - name: transaction_id
            description: Unique identifier for the sale transaction
          - name: sale_date
            description: Date the sale occurred (YYYY-MM-DD)
          - name: store_id
            description: Store identifier (FC001 to FC008)
          - name: product_sku
            description: Product stock-keeping unit code
          - name: quantity_sold
            description: Number of units sold in this line item
          - name: unit_price
            description: Price per unit at time of sale (EUR)
          - name: payment_method
            description: Payment method used (CASH, CARD, ONLINE)
          - name: customer_id
            description: Loyalty card customer ID (nullable for anonymous)
          - name: _ingested_at
            description: Timestamp when this record was loaded into bronze

      - name: raw_inventory
        description: >
          Daily end-of-day inventory snapshot per store and product.
          Sourced from ERP (Navision) nightly export.
        columns:
          - name: snapshot_date
            description: Date of the inventory snapshot
          - name: store_id
            description: Store identifier
          - name: product_sku
            description: Product stock-keeping unit code
          - name: quantity_on_hand
            description: Units physically in stock at end of day
          - name: reorder_point
            description: Minimum stock level before replenishment is triggered
          - name: _ingested_at
            description: Timestamp when this record was loaded into bronze

      - name: raw_products
        description: >
          Product master data from ERP. Contains all product attributes.
          Refreshed weekly from Navision.
        columns:
          - name: sku
            description: Unique product SKU (primary key)
          - name: product_name
            description: Full product name
          - name: product_category
            description: Top-level category (Dairy, Bakery, Produce, etc.)
          - name: subcategory
            description: Second-level category
          - name: brand
            description: Product brand name
          - name: supplier_id
            description: Supplier reference code
          - name: unit_cost
            description: Cost price from supplier (EUR)
          - name: _ingested_at
            description: Timestamp when this record was loaded into bronze

      - name: raw_customers
        description: >
          Loyalty card customer profiles. Combines data from in-store
          loyalty registration and the e-commerce platform.
        columns:
          - name: customer_id
            description: Unique customer identifier (loyalty card number)
          - name: first_name
            description: Customer first name
          - name: last_name
            description: Customer last name
          - name: email
            description: Customer email address
          - name: city
            description: Customer city of residence
          - name: postal_code
            description: Belgian postal code
          - name: registration_date
            description: Date customer joined the loyalty programme
          - name: opted_in_marketing
            description: Whether the customer accepted marketing communications
          - name: _ingested_at
            description: Timestamp when this record was loaded into bronze

      - name: raw_stores
        description: >
          FreshCart store master data. Static reference table.
        columns:
          - name: store_id
            description: Unique store identifier
          - name: store_name
            description: Full store name
          - name: city
            description: City where the store is located
          - name: region
            description: Belgian region (Flanders, Wallonia, Brussels)
          - name: store_type
            description: Format (Supermarket, Express, Online)
          - name: opening_date
            description: Date the store opened
          - name: _ingested_at
            description: Timestamp when this record was loaded into bronze
